plugins {
    id 'idea'
    id "maven-publish"
    id 'net.neoforged.gradle' version '[6.0.18,6.2)'
    id "org.openrewrite.rewrite" version "7.35.0"
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id "net.darkhax.curseforgegradle" version "1.1.15"
    id "com.modrinth.minotaur" version "2.+"
    id 'org.spongepowered.mixin' version '0.7.+'
    id "com.diffplug.spotless" version "7.0.4"
}

def sharedCodeQualityScript = file('../gradle/code-quality.gradle')
apply from: sharedCodeQualityScript.exists() ? sharedCodeQualityScript : 'https://raw.githubusercontent.com/P3pp3rF1y/MultiWorkspace/1.20.x/gradle/code-quality.gradle'

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

spotless {
    enforceCheck = false
    def spotlessFiles = findProperty("spotlessFiles")

    java {
        target spotlessFiles == null ? "src/*/java/**/*.java" : spotlessFiles.toString().split(/\s*,\s*/).findAll { it.endsWith(".java") }

        eclipse().configFile "$projectDir/codeformat/eclipse-java-format.xml"
        importOrder "", "javax", "java", "\\#"
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    groovyGradle {
        target spotlessFiles == null ? "*.gradle" : spotlessFiles.toString().split(/\s*,\s*/).findAll { it.endsWith(".gradle") }
        trimTrailingWhitespace()
        endWithNewline()
    }
}

version = "${project.minecraft_version}-${project.mod_version}.${getBuildNumber()}${getStable()}"
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = "https://modmaven.dev/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven {
        url "https://minecraft.curseforge.com/api/maven/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
            includeGroup "vazkii.botania"
        }
    }
    maven {
        name = "GHPCore"
        url = uri("https://maven.pkg.github.com/p3pp3rf1y/sophisticatedcore")
        credentials {
            username = System.getenv("GITHUB_ACTOR")
            password = System.getenv("GITHUB_TOKEN")
        }
        content {
            includeModule("net.p3pp3rf1y", "sophisticatedcore")
        }
    }
}

base {
    archivesName = mod_id
}

group = mod_group_id
version = "${project.minecraft_version}-${project.mod_version}.${getBuildNumber()}"
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '17'

minecraft {
    mappings channel: 'parchment', version: "$parchment_version"
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file("run/${it.name}")
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property "mixin.env.disableRefMap", "true"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                if (findProject(':SophisticatedCore') != null) {
                    "sophisticatedcore" {
                        source project(':SophisticatedCore').sourceSets.main
                    }
                }
            }
        }
        client {
        }
        server {
        }
        data {
            property 'fml.earlyprogresswindow', 'false'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    if (findProject(':SophisticatedCore') != null) {
        implementation project(':SophisticatedCore')
    } else {
        implementation fg.deobf("net.p3pp3rf1y:sophisticatedcore:${sc_version}") {
            transitive = false
        }
        testImplementation fg.deobf("net.p3pp3rf1y:sophisticatedcore:${sc_version}") {
            transitive = false
        }
    }

    minecraft "net.neoforged:forge:${minecraft_version}-${neo_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.+'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.+'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            sc_version          : "[" + sc_version.substring(sc_version.indexOf("-") + 1, sc_version.lastIndexOf(',')) + ",)",
            mod_id              : mod_id,
            mod_full_version    : "${project.mod_version}.${getBuildNumber()}"
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(["Specification-Title"     : project.mod_id,
                    "Specification-Vendor"    : project.mod_id,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : "${version}",
                    "Implementation-Vendor"   : project.mod_id,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")],)
    }
}

static def getBuildNumber() {
    if (System.getenv("GITHUB_RUN_NUMBER") != null) {
        return System.getenv("GITHUB_RUN_NUMBER").toString()
    }
    return ""
}

static def getStable() {
    if (System.getenv("GITHUB_REF") == null || System.getenv("GITHUB_REF").endsWith("-dev")) {
        return "-SNAPSHOT"
    }
    return ""
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("${github_package_url}")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            artifactId = mod_id
            from(components.java)
        }
    }
}

def sharedChangelogScript = file('../gradle/changelog.gradle')
apply from: sharedChangelogScript.exists() ? sharedChangelogScript : 'https://raw.githubusercontent.com/P3pp3rF1y/MultiWorkspace/1.20.x/gradle/changelog.gradle'

def hasCurseforgeId = project.hasProperty('curseforge_id') && project.curseforge_id?.toString()?.trim()
if (hasCurseforgeId) {
    task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        dependsOn 'generateChangelog'

        apiToken = System.getenv("CURSEFORGE_TOKEN")
        def mainFile = upload(project.curseforge_id, file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar"))
        mainFile.changelogType = 'markdown'
        mainFile.changelog = { project.ext.changelog }
        mainFile.addModLoader('Forge')
        mainFile.releaseType = "${release_type}"
        "${release_versions}".split(',').each {
            mainFile.addGameVersion("${it}")
        }
        mainFile.addRequirement('sophisticated-core')
        onlyIf { !project.ext.changelog.isEmpty() }
    }
} else {
    tasks.register('curseforge') {
        doLast {
            logger.lifecycle("Skipping curseforge publish: curseforge_id not configured")
        }
    }
}

def hasModrinthId = project.hasProperty('modrinth_project_id') && project.modrinth_project_id?.toString()?.trim()
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = hasModrinthId ? "${modrinth_project_id}" : ""
    versionType = "${release_type}"
    uploadFile = jar
    gameVersions = "${release_versions}".split(',').collect { e -> e }
    loaders = ["forge"]
    dependencies {
        required.project "sophisticated-core"
    }
    changelog = provider {
        project.ext.changelog
    }
}
tasks.modrinth {
    dependsOn(tasks.generateChangelog)
    onlyIf { hasModrinthId && !project.ext.changelog.isEmpty() }
}

task printVersionName {
    println "version:" + project.version
}
